[project]
name = "lingcore"
# Version is single-sourced from lingcore/__init__.py (__version__).
dynamic = ["version"]
description = "A lightweight, config-driven async agent framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ai", "agents", "llm", "openai", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "openai==2.41.0",
    "anthropic>=1.11.0",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "tiktoken==0.13.0",
    "regex==2026.5.9",
    "rich==15.0.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "prompt-toolkit==3.0.53",
]

[project.optional-dependencies]
# pymupdf is AGPL-3.0 (LingCore is Apache-2.0): kept out of the base install on
# purpose. Only the pdf2md tool / PDF modality fallback need it.
pdf = ["pymupdf==1.27.2.3"]
telegram = ["python-telegram-bot[rate-limiter,webhooks]==22.8"]

[project.scripts]
lingcore = "lingcore.__main__:main"

[project.urls]
Homepage = "https://github.com/lllluolingyu/LingCore"
Repository = "https://github.com/lllluolingyu/LingCore.git"
Issues = "https://github.com/lllluolingyu/LingCore/issues"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pymupdf==1.27.2.3",  # keep in sync with optional-dependencies.pdf
    # Keep in sync with optional-dependencies.telegram.
    "python-telegram-bot[rate-limiter,webhooks]==22.8",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "lingcore/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lingcore"]

# Immutable examples become package data under ``lingcore/profile_templates``.
# The explicit file manifest prevents ignored sessions, workspaces, memories,
# secrets, and local scratch artifacts from leaking into release wheels.
[tool.hatch.build.targets.wheel.force-include]
"profiles/coding/.env.example" = "lingcore/profile_templates/coding/.env.example"
"profiles/coding/config.yaml" = "lingcore/profile_templates/coding/config.yaml"
"profiles/coding/role.md" = "lingcore/profile_templates/coding/role.md"
"profiles/coding/workflow.md" = "lingcore/profile_templates/coding/workflow.md"
"profiles/coding/world.md" = "lingcore/profile_templates/coding/world.md"
"profiles/coding_ollama/config.yaml" = "lingcore/profile_templates/coding_ollama/config.yaml"
"profiles/daily/.env.example" = "lingcore/profile_templates/daily/.env.example"
"profiles/daily/config.yaml" = "lingcore/profile_templates/daily/config.yaml"
"profiles/daily/role.md" = "lingcore/profile_templates/daily/role.md"
"profiles/daily/workflow.md" = "lingcore/profile_templates/daily/workflow.md"
"profiles/daily/world.md" = "lingcore/profile_templates/daily/world.md"
"profiles/teaching/.env.example" = "lingcore/profile_templates/teaching/.env.example"
"profiles/teaching/config.yaml" = "lingcore/profile_templates/teaching/config.yaml"
"profiles/teaching/role.md" = "lingcore/profile_templates/teaching/role.md"
"profiles/teaching/workflow.md" = "lingcore/profile_templates/teaching/workflow.md"
"profiles/teaching/world.md" = "lingcore/profile_templates/teaching/world.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["lingcore"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
