name: browser
version: 1.0.0
api: 1
description: Browse the web in a headless Chromium (Playwright) — open pages that
  need JavaScript, read them as accessibility snapshots, click, type and screenshot.
module: browser_tools.py
provides:
- browser_navigate
- browser_snapshot
- browser_click
- browser_type
- browser_select
- browser_press
- browser_back
- browser_screenshot
- browser_close
hooks: BrowserHooks
hook_timeout: 30
requires:
  modules:
  - name: playwright
    hint: "the browser plugin needs Playwright: pip install 'lingcore[browser]' && playwright install chromium"
