# LingCore general daily-assistant profile (keyed provider).
# Secrets never live here — api_key_env only *names* the env var holding the key.
# Copy .env.example to .env for local configuration.
#
# A general-purpose everyday assistant: research, planning, note-taking, saving
# events to calendar files, and remembering your preferences across sessions.
# It does NOT run shell commands. Slash commands live in ./commands
# (/plan, /brief, /compare, /summarize, /event).

name: daily
# Notes and saved files land in ./workspace inside this profile dir by
# default — override with --workspace or LINGCORE_WORKSPACE.
workspace: ${LINGCORE_WORKSPACE:-}

llm:
  model: ${LINGCORE_MODEL:-deepseek-flash}
  base_url: ${LINGCORE_BASE_URL:-https://api.deepseek.com}
  api_key_env: ${LINGCORE_API_KEY_ENV:-DEEPSEEK_API_KEY}
  # Modality registration: attachment kinds the model accepts natively as
  # content parts. DeepSeek V4.1 Flash takes images and files, so both are
  # registered (this is also the default when the key is omitted). For a
  # text-only model set `modalities: []` — attached images/PDFs then degrade
  # to text via media_fallback below instead of erroring mid-turn.
  modalities: [image, file]
  # DeepSeek thinking mode: keep each reply's streamed reasoning_content and
  # send it back on later requests — the API rejects (400) a tool-bearing
  # request whose earlier assistant messages omit it.
  preserve_reasoning: true
  sampling:
    temperature: 0.6

persona:
  # Inline fallback — world.md / role.md / workflow.md load automatically.
  system_prompt: |
    You are a helpful general-purpose daily assistant.

tools:
  - read_file
  - pdf2md
  - write_file
  - edit_file
  - list_dir
  - search
  - search_web
  - fetch_url
  - memory
  - calendar_add
  - calendar_list

# Everyday tools are available immediately, including search over saved notes.
# clock tells the model the current date and time with each message (its hook
# needs this explicit entry); calendar's tools engage through the list above.
plugins: [search, clock]

tool_options:
  clock:
    # IANA name such as Asia/Shanghai or Europe/Berlin; blank uses the host's
    # timezone. The calendar uses the same zone unless calendar.timezone is set.
    timezone: ${LINGCORE_TIMEZONE:-}
  calendar:
    # New .ics files land here, inside the workspace; open or import them in
    # any calendar app. Nothing is sent to an online calendar.
    directory: calendar
    default_duration_minutes: 60
  search_web:
    # SearXNG needs a JSON-enabled instance (SEARXNG_URL in this profile's .env).
    # Optional providers: exa (EXA_API_KEY), deepseek (DEEPSEEK_API_KEY).
    provider: ${LINGCORE_SEARCH_PROVIDER:-searxng}
  fetch_url:
    # Public-web research. A private/loopback target asks for approval first
    # (confirm_private_hosts: false refuses it outright).
    max_bytes: 1048576
    # Behind a TUN-mode fake-IP proxy (Clash/mihomo, Surge, ...) every host
    # resolves into the benchmarking ranges below, so every fetch asks for
    # approval as non-public.
    # Exempting them lets the proxy route the request, but the proxy then picks
    # the real address, so a hostname pointing at a private host is no longer
    # caught (IP literals and localhost still are).
    allowed_networks: [198.18.0.0/15, "2001:2::/48"]
  memory:
    # Persistent notes/preferences, profile-scoped (resolves against this dir).
    path: memory.md
    max_bytes: 65536
    # When the file passes compact_at_ratio × max_bytes, condense it with the
    # model (merge/drop stale notes) instead of hard-failing the write.
    auto_compact: true
    compact_at_ratio: 0.8

# Text fallbacks for kinds missing from llm.modalities — consulted only when
# a kind is NOT registered above, so with [image, file] neither applies.
# PDFs degrade to extracted markdown automatically (pdf: markdown is the
# default; needs the optional pymupdf extra — a dev clone has it via
# `uv sync`). Without an image fallback, attached images become a short
# "cannot view images" note. To have them described by a vision-capable
# model instead, drop `image` from modalities, then uncomment and name one
# (and document its api_key_env in .env.example):
# media_fallback:
#   image:
#     model: Qwen/Qwen3.6-27B
#     base_url: https://your-provider.example/v1
#     api_key_env: VISION_API_KEY

memory:
  # Keep searches and verified source pages across a multi-turn research task.
  max_messages: 200
  max_tokens: 64000
  evict_to_ratio: 0.5
  compaction:
    enabled: true
    compact_at_ratio: 0.85
    keep_recent_ratio: 0.35
    max_summary_chars: 8000

loop:
  max_iters: 50
  parallel_tools: true

guardrail:
  policy: noop
