# LingCore coding-agent profile (Ollama/vLLM — keyless local server).

name: coding_ollama
# Where the agent's file tools and shell operate. Unset resolves to
# ./workspace inside this profile dir — point it at a real project with
# --workspace or LINGCORE_WORKSPACE.
workspace: ${LINGCORE_WORKSPACE:-}

llm:
  model: ${LINGCORE_MODEL:-qwen3.5:latest}
  base_url: ${LINGCORE_BASE_URL:-http://localhost:11434/v1}
  api_key_env: ${LINGCORE_API_KEY_ENV:-}
  # Attachment modalities the model accepts natively. Most local text models
  # accept neither, so this profile registers none — attached images/PDFs
  # degrade to text via media_fallback instead of erroring mid-turn. Raise to
  # [image] or [image, file] for a multimodal local model.
  modalities: []
  sampling:
    temperature: 0.2

persona:
  system_prompt: |
    You are a coding assistant. Your file tools (read_file, write_file,
    edit_file, patch_file, list_dir, search) and read-only git tool are confined
    to the workspace directory. run_shell uses the profile's Bubblewrap
    sandbox: the workspace is its only writable host mount, the host network is
    unavailable, and host paths are hidden unless the profile explicitly mounts
    them read-only.

    Work in small, verifiable steps: read a file before editing it, keep
    changes minimal, and run the project's own tests or checks after changing
    code. Report what you verified and what failed; never claim a check passed
    without running it. Prefer `search` and the `git` tool over shell commands,
    which need confirmation. Track work with three or more steps with
    `todo_write`, keeping one item in_progress. Do not commit, push, or delete
    files unless asked.
  # The workspace's own agent instructions (build/test commands, conventions)
  # are re-read into the prompt each request; the first file found wins.
  project_instructions:
    - AGENTS.md
    - CLAUDE.md

tools:
  - read_file
  - pdf2md
  - write_file
  - edit_file
  - list_dir
  - search
  - git
  - run_shell
  - fetch_url
  - patch_file
  - todo_write
  - activate_skill
  - codex_agent
  - claude_code_agent

# The external-agent tools are authorized above but hidden until their skill
# is activated (activate_skill asks for confirmation first). Everything else in
# `tools` stays enabled from the start.
skill_gated_tools:
  - codex_agent
  - claude_code_agent

tool_options:
  activate_skill:
    skills_dir: skills
    allow_concurrent: false
  # The outer-agent runners default to a 15-minute timeout, bounded capture,
  # and the CLI found on PATH. Override `executable` here if needed.
  codex_agent:
    timeout: 900
  claude_code_agent:
    timeout: 900
  # Search is bounded and pruned by default. Uncomment only values you want to
  # override; .lingcore is always excluded even when exclude_dirs is replaced.
  # search:
  #   max_hits: 100
  #   max_hits_per_file: 10
  #   max_line_chars: 200  # render cap; matching uses the full bounded line
  #   max_files_scanned: 5000
  #   max_dir_entries: 10000
  #   max_file_bytes: 262144
  #   max_depth: 25
  #   max_context_lines: 5
  #   time_budget_ms: 5000
  #   offload_over_chars: 8000
  #   exclude_dirs:
  #     - .git
  #     - .hg
  #     - .svn
  #     - node_modules
  #     - __pycache__
  #     - .venv
  #     - venv
  #     - .mypy_cache
  #     - .pytest_cache
  #     - .ruff_cache
  #     - .tox
  #     - dist
  #     - build
  #     - .next
  run_shell:
    # Default per-command timeout; the model may request up to max_timeout for
    # a slow build or test suite by passing `timeout` on the call.
    timeout: 120
    max_timeout: 1800
    require_confirmation: true
    allow_patterns: []
    sandbox:
      backend: bubblewrap
      executable: /usr/bin/bwrap
      network: false
      tmpfs_mb: 512
      path: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      pass_env: []
      read_only_mounts: []

# Text fallbacks for the modalities registered above. PDFs become extracted
# text automatically (needs the optional pymupdf extra: pip install
# 'lingcore[pdf]', or uv sync --extra pdf). To have images described by a
# local vision model instead of skipped, uncomment:
# media_fallback:
#   image:
#     model: qwen3-vl:latest
#     base_url: http://localhost:11434/v1

memory:
  # Keep this within your local server's context window (Ollama's num_ctx).
  max_messages: 200
  max_tokens: 32000
  evict_to_ratio: 0.5
  compaction:
    enabled: true
    compact_at_ratio: 0.85
    keep_recent_ratio: 0.35
    max_summary_chars: 6000

loop:
  # Tool round-trips per user turn (read, edit, test, fix loops add up).
  max_iters: 60
  parallel_tools: true

guardrail:
  policy: noop
