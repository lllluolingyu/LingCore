name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      harbor_e2e:
        description: Run synthetic Harbor Docker integration checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  harbor-bridge:
    if: github.event_name != 'schedule'
    name: Isolated Harbor bridge (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/harbor-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q

  harbor-integration:
    name: Synthetic Harbor Docker workflow
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.harbor_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LINGCORE_HARBOR_E2E: "1"
      LINGCORE_HARBOR_BRIDGE: ${{ github.workspace }}/adapters/harbor-bridge/.venv/bin/lingcore-harbor-bridge
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - run: uv python install 3.12 3.13
      - run: uv sync --locked --python 3.13
      - run: uv sync --locked --python 3.12 --project adapters/harbor-bridge
      - run: uv run --project adapters/harbor-bridge pytest adapters/harbor-bridge/tests -q
      - run: uv run pytest tests/test_harbor_e2e.py -q

  quality:
    if: github.event_name != 'schedule'
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --all-extras --python 3.13
      - run: uv run ruff check lingcore tests
      - run: uv run ruff format --check lingcore tests
      - run: uv run mypy

  test:
    if: github.event_name != 'schedule'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Run tests
        id: pytest
        run: uv run --python ${{ matrix.python-version }} pytest -q --junitxml="${{ runner.temp }}/pytest.xml"
      - name: Annotate test failures
        if: failure() && steps.pytest.outcome == 'failure'
        env:
          TEST_REPORT: ${{ runner.temp }}/pytest.xml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["TEST_REPORT"])
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for failure in [*case.findall("failure"), *case.findall("error")]:
                      name = f"{case.get('classname')}.{case.get('name')}"
                      detail = failure.text or failure.get("message", "")
                      message = (name + "\n" + detail)[-16000:]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error::{message}")
          PY

  lingchat-compatibility:
    if: github.event_name != 'schedule'
    name: LingChat main compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out LingCore
        uses: actions/checkout@v6
      - name: Check out LingChat main
        uses: actions/checkout@v6
        with:
          repository: lllluolingyu/LingChat
          ref: main
          path: LingChat
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
        working-directory: LingChat
      - run: uv run --python 3.13 pytest -q
        working-directory: LingChat

  package:
    if: github.event_name != 'schedule'
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python -c 'import os, lingcore; expected = f"v{lingcore.__version__}"; actual = os.environ["RELEASE_TAG"]; assert actual == expected, f"tag {actual} does not match package {expected}"'

  base-wheel:
    if: github.event_name != 'schedule'
    name: Base wheel stays Telegram-optional
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build
      - name: Install wheel without extras
        run: |
          uv venv --python 3.13 /tmp/lingcore-base
          uv pip install --python /tmp/lingcore-base/bin/python dist/*.whl
      - name: Verify base imports, CLI, doctor, and Telegram dependency error
        run: |
          /tmp/lingcore-base/bin/python -c 'import lingcore'
          /tmp/lingcore-base/bin/lingcore --help
          work="$(mktemp -d)"
          export LINGCORE_STATE_HOME="$work/state"
          # A placeholder model key, so the Telegram token below is doctor's
          # only error.
          export LLY_API_KEY=ci-placeholder
          /tmp/lingcore-base/bin/lingcore profile list
          /tmp/lingcore-base/bin/lingcore profile init coding
          /tmp/lingcore-base/bin/lingcore --list-sessions
          profile="$work/state/profiles/coding"
          printf '%s\n' \
            'token_env: TELEGRAM_BOT_TOKEN' \
            'allowed_user_ids: [1]' > "$profile/telegram.yaml"
          printf '%s\n' 'TELEGRAM_BOT_TOKEN=' >> "$profile/.env.example"
          set +e
          /tmp/lingcore-base/bin/lingcore doctor \
            --telegram-config "$profile/telegram.yaml"
          doctor_status=$?
          set -e
          test "$doctor_status" -eq 1
          output="$work/telegram-error"
          if /tmp/lingcore-base/bin/lingcore telegram \
            --profile "$profile" >"$output" 2>&1; then
            exit 1
          fi
          grep -F 'pip install "lingcore[telegram]"' "$output"
