schema_version: lingcore.eval.suite.v1
name: native-regression
track: development
source:
  kind: local
  cases:
    - cases/write-greeting.yaml
    - cases/retrieval-citation.yaml
    - cases/retrieval-refresh.yaml
    - cases/calendar-dst.yaml
    - cases/invoice-update.yaml
agent:
  profile: regression-agent.yaml
execution:
  runner: native
  repetitions: 3
  concurrency: 1
  infrastructure_retries: 0
  approval_policy: deny
  limits:
    wall_seconds: 120
    model_requests: 24
    tool_calls: 32
    reported_tokens: 64000
    usage_missing: stop
trace:
  required: true
  content: redacted
  max_bytes: 16777216
  artifact_max_bytes: 4194304
grading:
  authority: local
report:
  headline: mean_case_success
